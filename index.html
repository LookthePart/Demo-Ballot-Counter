/* Layout: control rail on the left, one phone on the right. Everything inside .mvp is the MVP's own stylesheet, copied as-is and scoped. Only the header and bottom bar are new. */
:root{
  font-size:18px;
  --pg:#EDEFF3; --pg-fg:#18202E; --pg-mute:#566175; --pg-card:#FFFFFF; --pg-line:#D3D9E3; --pg-acc:#1B2F52; --pg-acc-fg:#FFFFFF;

}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--pg);color:var(--pg-fg);font-family:var(--f);margin:0;padding-block:28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.stage{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:40px;max-width:880px;margin:0 auto;align-items:start}
.rail{display:flex;flex-direction:column;gap:22px;min-width:0;position:sticky;top:20px}
.rail h1{font-size:24px;line-height:1.15;margin:0;font-weight:800;text-wrap:balance}
.rail .lede{margin:6px 0 0;color:var(--pg-mute);font-size:15px;line-height:1.45}
.rail h3{font-size:12px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--pg-mute);margin:0 0 8px}
.ropts{display:flex;flex-wrap:wrap;gap:8px}
.ropt{border:1.5px solid var(--pg-line);background:var(--pg-card);color:var(--pg-fg);border-radius:10px;padding:8px 12px;font:700 15px var(--f);min-height:42px;cursor:pointer}

.rnote{background:var(--pg-card);border:1px solid var(--pg-line);border-radius:12px;padding:12px 14px;font-size:15px;line-height:1.5;margin:0}
.phonewrap{display:flex;justify-content:center;min-width:0}

  delete S.v['m'+(n-1)+'pub'];delete S.v['m'+(n-1)+'prot'];delete S.start['p'+(n-1)];delete S.start['u'+(n-1)];
}
function confirmHTML(h,p,ok){return '<div class="sheet pop"><div class="popc"><h3>'+(h||'Change this election?')+'</h3><p>'+(p||'This will change <b>all existing forms and reports</b> in this election cycle, including past days.')+'</p><button class="pop-go" data-act="cfok">'+(ok||'Yes, change it')+'</button><button class="pop-link" data-act="cfno">Cancel</button></div></div>';}
document.addEventListener('change',function(e){
  var el=e.target;if(el.dataset&&el.dataset.wzmodel!=null){(S.wz.d.models=S.wz.d.models||[])[+el.dataset.wzmodel]=el.value==='__o'?'':el.value;S.wz.dir='';render();return;}if(el.dataset&&el.dataset.model!=null){if(!S.snap)S.snap=snapNow();var mi=+el.dataset.model;S.models[mi]=el.value==='__o'?'':(el.value==='__n'?null:el.value);keepScroll(function(){S.modal=confirmHTML();render();});return;}if(el.id==='roll'){S.rollHr=+el.value;toast('Saved. New day starts at '+(S.rollHr===0?'midnight':S.rollHr+':00 AM')+'.');return;}if(el.id==='esel'){switchE(+el.value);S.snap=null;keepScroll(render);return;}if(S.screen!=='election'||!S.snap||!el.closest('#s-settings'))return;
  if(S.snap===snapNow())return;
  S.modal=confirmHTML();$('#overlay').innerHTML=S.modal;
});
document.addEventListener('focusin',function(e){
  var el=e.target;if(S.screen==='election'&&el.closest&&el.closest('#s-settings')&&!S.modal&&el.tagName==='INPUT'&&!S.snap)S.snap=snapNow();if(el.classList&&el.classList.contains('num')){setTimeout(function(){try{el.select();}catch(x){}},30);}
});

$('#phopts').innerHTML=PHOS.map(function(p){return '<button class="ropt" data-ph="'+p[0]+'">'+p[1]+'</button>';}).join('');
$('#jumps').innerHTML=JUMPS.map(function(j){return '<button class="ropt" data-go="'+j[0]+'">'+j[1]+'</button>';}).join('');
ensureKeys();render();
})();
</script>
